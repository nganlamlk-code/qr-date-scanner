<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QUÉT QR & MÃ VẠCH DATE</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#111}
.wrap{max-width:680px;margin:auto;padding:16px}
h1{font-size:22px;text-align:center;margin:8px 0 4px}
.sub{text-align:center;color:#666;font-size:14px;margin-bottom:12px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #0001;margin-bottom:12px}
#reader{width:100%;overflow:hidden;border-radius:12px}
.result{font-size:24px;font-weight:700;text-align:center;word-break:break-all;padding:12px}
button{width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px;font-size:16px;font-weight:700}
.primary{background:#111;color:#fff}.secondary{background:#e9ecef}
.note{font-size:14px;line-height:1.45;color:#555}
label{display:block;font-weight:700;margin:10px 0 4px}
input[type=range]{width:100%}
#zoomBox{display:none}
.status{text-align:center;font-size:14px;color:#666;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>QUÉT QR & MÃ VẠCH DATE</h1>
  <div class="sub">QR Code • EAN-13 • EAN-8 • UPC-A • UPC-E</div>

  <div class="card">
    <div id="reader"></div>
    <div id="status" class="status">Đang khởi động camera...</div>
  </div>

  <div class="card">
    <div class="note"><b>Để quét mã vạch 13 số nhỏ:</b> đưa camera gần mã vạch, giữ thẳng, đủ sáng. Nếu điện thoại hỗ trợ zoom camera, tăng zoom để các vạch chiếm phần lớn khung.</div>
    <div id="zoomBox">
      <label>Zoom camera: <span id="zoomValue">1×</span></label>
      <input id="zoom" type="range" min="1" max="1" step="0.1" value="1">
    </div>
  </div>

  <div class="card">
    <div class="note">Kết quả:</div>
    <div id="result" class="result">Chưa có mã</div>
    <button class="primary" onclick="copyCode()">SAO CHÉP MÃ</button>
    <button class="secondary" onclick="openForm()">MỞ GOOGLE FORM</button>
    <button class="secondary" onclick="restart()">QUÉT LẠI</button>
  </div>
</div>

<script>
const FORM_URL = "https://docs.google.com/forms/d/1jB3CHYlO5TvvV8XVucdNFwwhJv-4cRMXjKFqZCzuyY8/edit";
let scanner = null;
let lastCode = "";
let zoomSupported = false;

function setStatus(t){document.getElementById("status").textContent=t;}

function onSuccess(decodedText, decodedResult){
  const code = String(decodedText || "").replace(/\D/g,"");
  if(!code) return;
  lastCode = code;
  document.getElementById("result").textContent = code;
  setStatus("Đã nhận mã: " + code);
  try{ scanner.pause(true); }catch(e){}
}

async function start(){
  scanner = new Html5Qrcode("reader");
  const config = {
    fps: 15,
    qrbox: (w,h) => ({width: Math.floor(w*0.92), height: Math.floor(Math.min(h*0.38, 220))}),
    aspectRatio: 1.7777778,
    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E
    ]
  };
  try{
    await scanner.start(
      {facingMode:"environment", width:{ideal:1920}, height:{ideal:1080}},
      config, onSuccess,
      ()=>{}
    );
    setStatus("Camera sẵn sàng – đưa mã vạch vào giữa khung");
    setupZoom();
  }catch(e){
    setStatus("Không mở được camera. Hãy cho phép Camera rồi tải lại trang.");
    console.error(e);
  }
}

async function setupZoom(){
  try{
    const caps = scanner.getRunningTrackCameraCapabilities();
    const z = caps && caps.zoom;
    if(z && typeof z.min === "number" && typeof z.max === "number" && z.max > z.min){
      zoomSupported = true;
      const box = document.getElementById("zoomBox");
      const slider = document.getElementById("zoom");
      slider.min = z.min; slider.max = z.max;
      slider.step = z.step || 0.1;
      slider.value = Math.max(z.min, Math.min(z.max, z.min));
      document.getElementById("zoomValue").textContent = Number(slider.value).toFixed(1).replace(".0","") + "×";
      box.style.display = "block";
      slider.oninput = async function(){
        document.getElementById("zoomValue").textContent = Number(this.value).toFixed(1).replace(".0","") + "×";
        try{
          await scanner.applyVideoConstraints({advanced:[{zoom:Number(this.value)}]});
        }catch(e){}
      };
    }
  }catch(e){}
}

async function restart(){
  lastCode="";
  document.getElementById("result").textContent="Chưa có mã";
  try{
    scanner.resume();
    setStatus("Đưa mã vạch vào giữa khung");
  }catch(e){
    location.reload();
  }
}
async function copyCode(){
  if(!lastCode) return alert("Chưa có mã để sao chép.");
  await navigator.clipboard.writeText(lastCode);
  alert("Đã sao chép mã: " + lastCode);
}
function openForm(){ window.open(FORM_URL,"_blank"); }

start();
</script>
</body>
</html>
