<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR DATE - Nhập UPC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17202a;font-family:Arial,sans-serif}main{max-width:620px;margin:auto;padding:16px}h1{text-align:center;font-size:23px}.sub{text-align:center;color:#606b75;font-size:14px;margin-bottom:16px}.card{background:#fff;padding:16px;border-radius:16px;box-shadow:0 2px 10px #0001;margin-bottom:14px}label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #c9d0d6;border-radius:9px;font-size:16px;background:white}button{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:700;margin-top:12px;background:#1769aa;color:white}.note{font-size:13px;line-height:1.5;color:#58636e}.status{font-size:14px;line-height:1.45;margin-top:12px;white-space:pre-wrap}.good{color:#087f23}.bad{color:#b42318}
</style></head><body><main>
<h1>QR DATE – KIỂM TRA HẠN SỬ DỤNG</h1><div class="sub">Nhập UPC 13 số • Lưu Google Sheets</div>
<div class="card"><form id="entryForm">
<label>Nhân viên kiểm tra *</label><input id="staff" required placeholder="Họ tên nhân viên">
<label>Vị trí kiểm tra *</label><input id="location" required placeholder="Ví dụ: Quầy TPCN / Kệ số 2">
<label>UPC / Mã vạch 13 số *</label><input id="upc" required inputmode="numeric" maxlength="13" pattern="[0-9]{13}" placeholder="Nhập đủ 13 chữ số"><div class="note">Nhập dãy số in bên dưới mã vạch.</div>
<label>Ngày sản xuất</label><input id="mfg" type="date">
<label>Hạn sử dụng *</label><input id="expiry" type="date" required>
<label>Số lượng *</label><input id="qty" type="number" min="0" step="1" required value="1">
<label>Hình thức xử lý</label><select id="action"><option value="">-- Chọn --</option><option>Kiểm tra theo dõi</option><option>Rút khỏi quầy</option><option>Trả nhà cung cấp</option><option>Khác</option></select>
<label>Ghi chú</label><textarea id="notes" rows="2"></textarea>
<button id="submitBtn" type="submit">GỬI DỮ LIỆU LÊN GOOGLE SHEETS</button><div id="status" class="status" role="status"></div>
</form></div><div class="card note">Dữ liệu sẽ được ghi vào Form_Responses và DU LIEU DATE. Hàng còn không quá 20% HSD sẽ có trạng thái RÚT KHỎI QUẦY và tô đỏ cả dòng. Hãy xác nhận bản ghi xuất hiện trong Google Sheets sau lần gửi thử.</div>
</main>
<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbxg0lkxCaFIKwFPBTUXU6BF0XN8tzDG_xMUafUM9SBtwt_6jCdf6sFxT9GkP4o1UrA/exec";
const form=document.getElementById("entryForm"),statusEl=document.getElementById("status"),btn=document.getElementById("submitBtn");
document.getElementById("upc").addEventListener("input",e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,13));
form.addEventListener("submit",async e=>{
 e.preventDefault();const upc=document.getElementById("upc").value.trim();
 if(!/^\d{13}$/.test(upc)){statusEl.className="status bad";statusEl.textContent="UPC phải gồm đúng 13 chữ số.";return}
 if(WEB_APP_URL==="DAN_WEB_APP_URL_VAO_DAY"||!WEB_APP_URL.startsWith("https://script.google.com/")){statusEl.className="status bad";statusEl.textContent="Chưa kết nối. Dán URL Web App vào biến WEB_APP_URL trong index.html trước khi dùng.";return}
 const d=new URLSearchParams();for(const id of ["staff","location","upc","mfg","expiry","qty","action","notes"])d.set(id,document.getElementById(id).value.trim());
 btn.disabled=true;btn.textContent="ĐANG GỬI...";statusEl.className="status";statusEl.textContent="Đang gửi yêu cầu...";
 try{await fetch(WEB_APP_URL,{method:"POST",mode:"no-cors",body:d});statusEl.className="status good";statusEl.textContent="Đã gửi yêu cầu. Hãy kiểm tra DU LIEU DATE để xác nhận bản ghi đã xuất hiện.";document.getElementById("upc").value="";document.getElementById("mfg").value="";document.getElementById("expiry").value="";document.getElementById("qty").value="1";document.getElementById("action").value="";document.getElementById("notes").value=""}
 catch(err){statusEl.className="status bad";statusEl.textContent="Gửi chưa thành công. Kiểm tra internet và URL Web App."}
 finally{btn.disabled=false;btn.textContent="GỬI DỮ LIỆU LÊN GOOGLE SHEETS"}
});
</script></body></html>
