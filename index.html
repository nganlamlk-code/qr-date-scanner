<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#c62828">
<title>QR DATE - Quét QR & Mã vạch</title>
<style>
body{margin:0;background:#f5f5f5;font-family:Arial;color:#222}.wrap{max-width:560px;margin:auto;padding:16px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}
h1{text-align:center;font-size:23px;margin:8px}.sub{text-align:center;color:#666}
#reader{width:100%;min-height:280px;background:#111;border-radius:12px;overflow:hidden;margin-top:12px}
#result{text-align:center;font-size:25px;font-weight:bold;word-break:break-all;padding:14px}
.status{text-align:center;color:#666;line-height:1.5}
button{width:100%;padding:15px;border:0;border-radius:12px;margin-top:10px;font-size:17px;font-weight:bold}
.red{background:#c62828;color:#fff}.gray{background:#eee}.green{background:#188038;color:#fff}
.note{font-size:13px;color:#666;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<h1>📷 QUÉT QR & MÃ VẠCH DATE</h1>
<div class="sub">QR Code • EAN-13 • EAN-8 • UPC-A • UPC-E</div>

<div class="card">
<div id="reader"></div>
<div id="status" class="status">Đang mở camera…</div>
</div>

<div class="card">
<div style="text-align:center;font-weight:bold">KẾT QUẢ</div>
<div id="result">Chưa quét</div>
<button id="copy" class="gray" disabled>📋 SAO CHÉP MÃ</button>
<button id="form" class="red" disabled>📝 MỞ GOOGLE FORM</button>
<button id="again" class="green">🔄 QUÉT LẠI</button>
</div>

<div class="card note">
<b>Quét được cả:</b> QR Code và mã vạch sản phẩm EAN-13.<br>
Nếu trình duyệt hỏi quyền Camera, chọn <b>Cho phép</b>.
</div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const FORM="https://docs.google.com/forms/d/1jB3CHYlO5TvvV8XVucdNFwwhJv-4cRMXjKFqZCzuyY8/viewform";
let qr=null,running=false,code="";
const result=document.getElementById("result"),status=document.getElementById("status");
const copy=document.getElementById("copy"),form=document.getElementById("form");

function show(text){
 code=String(text);
 result.textContent=code;
 copy.disabled=false; form.disabled=false;
 status.textContent="✅ Đã nhận: "+code;
}
async function stop(){
 if(qr){try{if(running)await qr.stop()}catch(e){}try{await qr.clear()}catch(e){}}
 running=false;
}
async function start(){
 await stop();
 qr=new Html5Qrcode("reader");
 status.textContent="📷 Đang xin quyền Camera…";
 try{
   await qr.start(
    {facingMode:"environment"},
    {fps:10,qrbox:{width:280,height:180}},
    async t=>{show(t);await stop()},
    ()=>{}
   );
   running=true;
   status.textContent="Đưa QR hoặc mã vạch vào khung";
 }catch(e){
   status.textContent="❌ Không mở được Camera. Hãy cho phép Camera cho Safari/Chrome rồi tải lại trang.";
 }
}
copy.onclick=async()=>{
 try{await navigator.clipboard.writeText(code);status.textContent="✅ Đã sao chép: "+code}
 catch(e){status.textContent="Hãy nhấn giữ mã để sao chép."}
};
form.onclick=async()=>{
 if(!code)return;
 try{await navigator.clipboard.writeText(code)}catch(e){}
 location.href=FORM;
};
document.getElementById("again").onclick=()=>{
 result.textContent="Chưa quét";copy.disabled=true;form.disabled=true;start();
};
window.onload=start;
</script>
</body>
</html>
