<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR DATE – Quét mã nhanh</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#111}
.wrap{max-width:680px;margin:auto;padding:16px}h1{text-align:center;font-size:22px;margin:8px 0 4px}.sub{text-align:center;color:#666;margin-bottom:12px;font-size:14px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #0001;margin-bottom:12px}
#reader{width:100%;overflow:hidden;border-radius:12px}.status{text-align:center;color:#555;font-size:14px;line-height:1.45;margin:8px 0}
.result{text-align:center;font-size:24px;font-weight:700;word-break:break-all;padding:12px}
button{width:100%;padding:14px;margin-top:8px;border:0;border-radius:10px;font-size:16px;font-weight:700}
.primary{background:#111;color:#fff}.photo{background:#1769aa;color:#fff}.secondary{background:#e9ecef}
.note{font-size:14px;line-height:1.5;color:#555}#photoInput{display:none}#preview{display:none;width:100%;margin-top:10px;border-radius:8px}
.success{color:#087f23;font-weight:bold}
</style></head>
<body><div class="wrap">
<h1>QUÉT QR & MÃ VẠCH DATE</h1><div class="sub">QR Code • EAN-13 • EAN-8 • UPC-A • UPC-E</div>
<div class="card"><div id="reader"></div><div id="status" class="status">Đang khởi động...</div>
<button class="photo" onclick="document.getElementById('photoInput').click()">📷 CHỤP HÌNH / CHỌN ẢNH MÃ 13</button>
<input id="photoInput" type="file" accept="image/*" capture="environment"><img id="preview" alt="Ảnh đã chọn"></div>
<div class="card"><div class="note"><b>Quét ảnh nhanh:</b> hệ thống chỉ thử một số vùng ảnh được chọn và dừng sớm nếu không đọc được, không chạy xử lý kéo dài nhiều phút.</div></div>
<div class="card"><div class="note">Kết quả:</div><div id="result" class="result">Chưa có mã</div>
<button class="primary" onclick="copyCode()">SAO CHÉP MÃ</button><button class="secondary" onclick="openForm()">MỞ GOOGLE FORM</button><button class="secondary" onclick="restart()">QUÉT LẠI</button></div>
</div>
<script>
const FORM_URL="https://docs.google.com/forms/d/1jB3CHYlO5TvvV8XVucdNFwwhJv-4cRMXjKFqZCzuyY8/edit";
let scanner=null,lastCode="";
function setStatus(t,ok=false){const e=document.getElementById("status");e.textContent=t;e.className="status"+(ok?" success":"")}
function showCode(code,source){lastCode=String(code||"").trim();document.getElementById("result").textContent=lastCode;setStatus("Đã đọc mã từ "+source+": "+lastCode,true);try{scanner&&scanner.pause(true)}catch(e){}}
async function startCamera(){
 try{scanner=new Html5Qrcode("reader",{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E]});
 await scanner.start({facingMode:"environment"},{fps:10,qrbox:(w,h)=>({width:Math.floor(w*.94),height:Math.min(220,Math.floor(h*.42))})},t=>showCode(t,"camera"),()=>{});
 setStatus("Camera sẵn sàng. Nếu không đọc được, chọn ảnh mã vạch.");}
 catch(e){setStatus("Camera chưa mở được. Bạn vẫn có thể chọn ảnh mã vạch.");}}
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
function cropDataUrl(img,rx,ry,rw,rh,contrast=false){
 const w=img.naturalWidth,h=img.naturalHeight,x=Math.round(w*rx),y=Math.round(h*ry),cw=Math.round(w*rw),ch=Math.round(h*rh);
 const scale=Math.min(2.5,1600/Math.max(cw,ch));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(cw*scale));c.height=Math.max(1,Math.round(ch*scale));
 const ctx=c.getContext("2d");ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.drawImage(img,x,y,cw,ch,0,0,c.width,c.height);
 if(contrast){const d=ctx.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4){const v=Math.max(0,Math.min(255,((.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2])-128)*1.7+128));d.data[i]=d.data[i+1]=d.data[i+2]=v}ctx.putImageData(d,0,0)}
 return c.toDataURL("image/jpeg",.92)
}
async function decodeOne(reader,url){
 const im=await loadImage(url);
 return reader.decodeFromImageElement(im).getText();
}
async function decodePhoto(file){
 if(!window.ZXing||!ZXing.BrowserMultiFormatReader)throw Error("Thư viện giải mã chưa tải xong. Kiểm tra internet rồi tải lại trang.");
 const src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
 const img=await loadImage(src);
 const reader=new ZXing.BrowserMultiFormatReader();
 const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.QR_CODE]);hints.set(ZXing.DecodeHintType.TRY_HARDER,true);reader.hints=hints;
 // A short, bounded list of likely barcode areas. Never loop indefinitely.
 const regions=[[0,0,1,1],[0,.42,1,.48],[.05,.52,.90,.38],[.10,.58,.80,.28]];
 for(let i=0;i<regions.length;i++){
   setStatus("Đang thử vùng ảnh "+(i+1)+" / "+regions.length+"…");
   for(const contrast of [false,true]){
     const url=cropDataUrl(img,...regions[i],contrast);
     try{const code=await decodeOne(reader,url);try{reader.reset()}catch(e){}return code}catch(e){}
   }
   await new Promise(r=>setTimeout(r,0));
 }
 try{reader.reset()}catch(e){}
 throw Error("Không đọc được trong thời gian xử lý ngắn");
}
document.getElementById("photoInput").addEventListener("change",async function(){
 const file=this.files&&this.files[0];if(!file)return;
 const preview=document.getElementById("preview");preview.src=URL.createObjectURL(file);preview.style.display="block";
 setStatus("Đang xử lý ảnh, vui lòng chờ vài giây…");
 const started=Date.now();
 try{const code=await decodePhoto(file);showCode(code,"ảnh");}
 catch(e){setStatus("Chưa đọc được mã. Không cần chờ thêm; hãy thử ảnh cắt sát mã vạch hoặc gửi ảnh để kiểm tra.");alert("Chưa đọc được mã sau các lần thử nhanh. Bạn không cần chờ thêm nhiều phút. Hãy thử cắt ảnh sát mã vạch, giữ đủ hai mép vạch và dãy số bên dưới.");}
 finally{this.value="";}
});
async function restart(){lastCode="";document.getElementById("result").textContent="Chưa có mã";document.getElementById("preview").style.display="none";try{scanner.resume();setStatus("Đưa mã vạch vào giữa khung")}catch(e){location.reload()}}
async function copyCode(){if(!lastCode){alert("Chưa có mã để sao chép.");return}try{await navigator.clipboard.writeText(lastCode);alert("Đã sao chép mã: "+lastCode)}catch(e){alert("Mã: "+lastCode)}}
function openForm(){window.open(FORM_URL,"_blank")}start();
</script></body></html>
